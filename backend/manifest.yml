---
applications:
  - name: nd-orbit-backend
    buildpacks:
      - python_buildpack
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    memory: 512M
    disk_quota: 1G
    instances: 1
    health-check-type: http
    health-check-http-endpoint: /health
    env:
      AICORE_CLIENT_ID: ((AICORE_CLIENT_ID))
      AICORE_CLIENT_SECRET: ((AICORE_CLIENT_SECRET))
      AICORE_AUTH_URL: ((AICORE_AUTH_URL))
      AICORE_BASE_URL: ((AICORE_BASE_URL))
      AICORE_RESOURCE_GROUP: default
      LLM_DEPLOYMENT_ID: ((LLM_DEPLOYMENT_ID))
      HANA_HOST: ((HANA_HOST))
      HANA_PORT: 443
      HANA_USER: ((HANA_USER))
      HANA_PASSWORD: ((HANA_PASSWORD))
      HANA_SCHEMA: AI_USE_CASES_HDI_DB_1
      CPI_API_URL: https://api-eih-qa.next-decade.com/external/integrationhub/correlation/logs/v1
      ALLOWED_ORIGINS: ((FRONTEND_URL))
      LLM_USAGE_MONITOR_APP_ID: "28"
      LLM_USAGE_MONITOR_MODEL_NAME: claude-sonnet-4-6
      LLM_USAGE_MONITOR_CALL_TYPE_L_INVOKE: l_invoke
      LLM_USAGE_MONITOR_CALL_TYPE_A_INVOKE: a_invoke
      LLM_USAGE_MONITOR_BASE_URL: ((LLM_USAGE_MONITOR_BASE_URL))
      LLM_USAGE_MONITOR_API_KEY: ((LLM_USAGE_MONITOR_API_KEY))
